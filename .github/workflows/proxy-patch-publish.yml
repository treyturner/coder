name: Publish approved proxy CLI

on:
  workflow_dispatch:
    inputs:
      verification_run_id:
        description: Successful Verify patched proxy CLI run for the current main commit
        type: string
        required: true
      approved_index:
        description: Independently reviewed registry index digest (sha256:...)
        type: string
        required: true
      approved_manifest:
        description: Independently reviewed Linux amd64 manifest digest (sha256:...)
        type: string
        required: true

permissions: {}

concurrency:
  group: proxy-patch-publication
  cancel-in-progress: false

jobs:
  prepare:
    if: github.server_url == 'https://github.com' && github.repository == 'treyturner/coder' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    defaults:
      run:
        working-directory: proxy-patch
    env:
      VERIFY_RUN_ID: ${{ inputs.verification_run_id }}
      APPROVED_INDEX: ${{ inputs.approved_index }}
      APPROVED_MANIFEST: ${{ inputs.approved_manifest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Choose temporary build directory
        run: printf 'PATCH_WORK=%s/coder-proxy-publish\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14.4'
      - name: Select frozen packaging runtime
        run: python3 scripts/ci_packager.py --work "$PATCH_WORK"
      - name: Check source verification run
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/check_run.py "$VERIFY_RUN_ID"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: coder-proxy-linux-amd64
          path: ${{ env.PATCH_WORK }}/dist
          repository: treyturner/coder
          run-id: ${{ inputs.verification_run_id }}
          github-token: ${{ github.token }}
      - name: Verify approved artifact and publication guards
        run: |
          python3 -m unittest discover -s tests -p 'test_*.py'
          python3 scripts/publish.py verify --work "$PATCH_WORK" --approved-index "$APPROVED_INDEX" --approved-manifest "$APPROVED_MANIFEST"
      - name: Qualify the pinned registry publisher
        run: |
          python3 scripts/pipeline.py assemble --work "$PATCH_WORK" --assembly publisher
          python3 scripts/publish.py test --work "$PATCH_WORK" --assembly publisher
          python3 scripts/publish.py build --work "$PATCH_WORK" --assembly publisher
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: proxy-registry-publisher
          path: |
            ${{ env.PATCH_WORK }}/tools/registry-publisher/publish
            ${{ env.PATCH_WORK }}/tools/registry-publisher/publish.sha256
          if-no-files-found: error
          retention-days: 1

  companions:
    if: github.server_url == 'https://github.com' && github.repository == 'treyturner/coder' && github.ref == 'refs/heads/main'
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    defaults:
      run:
        working-directory: proxy-patch
    env:
      VERIFY_RUN_ID: ${{ inputs.verification_run_id }}
      APPROVED_INDEX: ${{ inputs.approved_index }}
      APPROVED_MANIFEST: ${{ inputs.approved_manifest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Choose temporary build directory
        run: printf 'PATCH_WORK=%s/coder-proxy-companions\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14.4'
      - name: Select frozen packaging runtime
        run: python3 scripts/ci_packager.py --work "$PATCH_WORK"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: coder-proxy-linux-amd64
          path: ${{ env.PATCH_WORK }}/dist
          repository: treyturner/coder
          run-id: ${{ inputs.verification_run_id }}
          github-token: ${{ github.token }}
      - name: Retain and read back exact approved build records
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release.py --work "$PATCH_WORK" --verification-run-id "$VERIFY_RUN_ID" --approved-index "$APPROVED_INDEX" --approved-manifest "$APPROVED_MANIFEST"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: proxy-companion-receipt
          path: ${{ env.PATCH_WORK }}/evidence/companions.json
          if-no-files-found: ignore
          retention-days: 90

  publish:
    if: github.server_url == 'https://github.com' && github.repository == 'treyturner/coder' && github.ref == 'refs/heads/main'
    needs: [prepare, companions]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
      packages: write
    defaults:
      run:
        working-directory: proxy-patch
    env:
      APPROVED_INDEX: ${{ inputs.approved_index }}
      APPROVED_MANIFEST: ${{ inputs.approved_manifest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Choose temporary build and authentication directories
        run: |
          printf 'PATCH_WORK=%s/coder-proxy-publish\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'DOCKER_CONFIG=%s/coder-proxy-registry-auth\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14.4'
      - name: Select frozen packaging runtime
        run: python3 scripts/ci_packager.py --work "$PATCH_WORK"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: coder-proxy-linux-amd64
          path: ${{ env.PATCH_WORK }}/dist
          repository: treyturner/coder
          run-id: ${{ inputs.verification_run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: proxy-registry-publisher
          path: ${{ env.PATCH_WORK }}/tools/registry-publisher
      - name: Verify approved artifact before registry authentication
        run: |
          python3 scripts/publish.py verify --work "$PATCH_WORK" --approved-index "$APPROVED_INDEX" --approved-manifest "$APPROVED_MANIFEST"
          chmod 700 "$PATCH_WORK/tools/registry-publisher/publish"
      - name: Authenticate with existing registry credentials
        env:
          GHCR_TOKEN: ${{ github.token }}
          FORGEJO_USER: ${{ secrets.FORGEJO_REGISTRY_USERNAME }}
          FORGEJO_TOKEN: ${{ secrets.FORGEJO_REGISTRY_TOKEN }}
        run: |
          if [ -z "$FORGEJO_USER" ] || [ -z "$FORGEJO_TOKEN" ]; then
            echo 'Existing Forgejo registry credentials must be bound before publication.' >&2
            exit 1
          fi
          install -d -m 700 "$DOCKER_CONFIG"
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username treyturner --password-stdin >/dev/null 2>&1
          printf '%s' "$FORGEJO_TOKEN" | docker login forgejo.treyturner.info --username "$FORGEJO_USER" --password-stdin >/dev/null 2>&1
      - name: Publish identical OCI bytes and verify both registries
        run: python3 scripts/publish.py publish --work "$PATCH_WORK" --approved-index "$APPROVED_INDEX" --approved-manifest "$APPROVED_MANIFEST"
      - name: Remove temporary registry authentication
        if: always()
        run: rm -rf -- "$DOCKER_CONFIG"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: proxy-publication-receipt
          path: ${{ env.PATCH_WORK }}/evidence/publication.json
          if-no-files-found: ignore
          retention-days: 90
